<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Voice Booster</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <h2>🎙️ Voice Booster</h2>
    <div class="row">
      <label>Power</label>
      <input id="enabled" type="checkbox" checked>
    </div>
    <div class="control">
      <label>Mic Gain (dB): <span id="gainDbVal">1000</span></label>
      <!-- এখানে max="2000" করে দেওয়া হয়েছে যাতে ১০০০ পর্যন্ত সিলেক্ট করা যায় -->
      <input id="gainDb" type="range" min="0" max="2000" value="1000">
    </div>
    <div class="control">
      <label>Loudness Boost: <span id="loudnessVal">100</span></label>
      <!-- এখানে max="500" করে দেওয়া হয়েছে যাতে ১০০ পর্যন্ত সিলেক্ট করা যায় -->
      <input id="loudness" type="range" min="1" max="500" step="5" value="100">
    </div>
    <div class="control">
      <label>Low Bass: <span id="lowShelfDbVal">12</span></label>
      <input id="lowShelfDb" type="range" min="-20" max="30" value="12">
    </div>
    <div class="control">
      <label>Voice Presence (Mid): <span id="presenceDbVal">12</span></label>
      <input id="presenceDb" type="range" min="-20" max="30" value="12">
    </div>
    <div id="status" class="status">Ultra Mode Active</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
